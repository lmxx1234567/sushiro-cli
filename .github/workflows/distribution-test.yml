name: npm distribution tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['packaging/**', 'scripts/release/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'THIRD_PARTY*', 'LICENSE', 'NOTICE*', 'CREDITS.md', 'PRIVACY.md', 'DISCLAIMER.md', 'SECURITY.md', '.github/workflows/distribution-test.yml']
permissions:
  contents: read
jobs:
  packaging:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: node --test packaging/test/*.test.mjs
